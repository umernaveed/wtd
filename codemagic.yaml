workflows:
  android-debug:
    name: Android debug APK
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: 3.38.9
    scripts:
      - name: Check Firebase configuration
        script: |
          python3 - <<'PY'
          import json
          import sys

          with open('android/app/google-services.json', encoding='utf-8') as f:
              config = json.load(f)
          packages = [client.get('client_info', {}).get('android_client_info', {}).get('package_name')
                      for client in config.get('client', [])]
          if 'com.worldtradecourier.com' not in packages:
              sys.exit('Firebase configuration is missing com.worldtradecourier.com. Register the Android app in Firebase and replace android/app/google-services.json with its downloaded configuration.')
          PY
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
